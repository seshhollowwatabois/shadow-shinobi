<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shadow Shinobi</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#080b12;color:#f5f7fb}
body{display:flex;justify-content:center}
button{font:inherit;cursor:pointer}
#game{width:min(1100px,100%);min-height:100vh;background:linear-gradient(180deg,#101827,#080b12);padding:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:clamp(28px,6vw,48px);letter-spacing:2px}
.sub{color:#8ea0b9;font-size:13px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:#151f30;border:1px solid #26344b;border-radius:999px;padding:8px 12px;font-size:13px}
.screen{background:#0d1421;border:1px solid #26344b;border-radius:18px;padding:18px;box-shadow:0 14px 40px #0006}
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}
@media(max-width:700px){.hero{grid-template-columns:1fr}#game{padding:12px}}
.card{background:#111a29;border:1px solid #27364d;border-radius:14px;padding:16px}
h2,h3{margin-top:0}
.avatar{height:240px;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle,#263b5d 0,#111a29 48%,#080b12 100%);font-size:100px}
.hp{height:12px;background:#263044;border-radius:20px;overflow:hidden;margin:8px 0 14px}
.hp>i{display:block;height:100%;background:#55d68a;width:100%;transition:.25s}
.enemy .hp>i{background:#e75b68}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.btn{border:1px solid #344967;background:#18243a;color:#fff;border-radius:10px;padding:12px;transition:.15s}
.btn:hover{transform:translateY(-1px);background:#21314d}
.btn.primary{background:#315fa8;border-color:#4e83d2}
.btn.danger{background:#702c39;border-color:#a94455}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.log{height:180px;overflow:auto;background:#080d16;border-radius:10px;padding:10px;font-size:14px;line-height:1.55}
.log div{border-bottom:1px solid #182232;padding:5px 0}
.menu{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hidden{display:none!important}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid #344967;background:#0a101b;color:#fff;margin:8px 0 12px}
.reward{color:#ffd166}
</style>

<style>

.quick,.menu{border-color:#49351f}

.start-panel{background:linear-gradient(145deg,#302318e8,#120c08f2)!important;border:2px solid #85663b!important;border-radius:5px!important;box-shadow:inset 0 0 0 2px #181008,0 12px 40px #000!important}

<script>
/* === ANIME PREVIEW DETAILS === */
(function(){
  function refreshAnime(){
    const n=document.getElementById("creatorNinja");
    if(!n)return;
    n.setAttribute("data-anime","true");
  }
  const old=window.characterCreator;
  if(old)window.characterCreator=function(){old();refreshAnime();};
  setTimeout(refreshAnime,0);
})();
</script>

<body>

<div id="startScreen">
 <div class="start-bg"></div><div class="start-mountains"></div><div class="start-mist"></div><div class="start-fireflies"></div>
 <div class="start-panel">
  <h1 class="start-title">SHADOW<br>SHINOBI</h1>
  <div class="start-subtitle">Enter the world of the shinobi</div>
  <button class="start-btn new" onclick="newGame()">⚔️ NEW GAME</button>
  <button class="start-btn" id="loadGameBtn" onclick="loadGame()">▶ LOAD GAME</button>
  <button class="start-btn" onclick="continueAsGuest()">👤 QUICK START</button>
  <div class="start-save" id="saveStatus"></div>
 </div>
</div>
<div id="game" class="start-hidden">
<header>
  <div>
    <h1>SHADOW SHINOBI</h1>
    <div class="sub">A new ninja adventure begins.</div>
  </div>
  <div class="stats">
    <div class="pill">Lv <b id="level">1</b></div>
    <div class="pill">XP <b id="xp">0</b>/<b id="nextxp">100</b></div>
    <div class="pill">🪙 <b id="coins">100</b></div>
  </div>
</header>

<div id="app"></div>
</div>

<script>
const state={
  name:"Shadow", gender:"Male", hair:0, outfit:0,
  level:1,xp:0,coins:100,
  hp:100,maxHp:100,energy:50,maxEnergy:50,
  attack:10,defense:3,agility:5,crit:5,
  enemy:null,busy:false
};

const enemies=[
  {name:"Rogue Shinobi",emoji:"🥷",hp:70,maxHp:70,atk:8,xp:35,coins:25},
  {name:"Forest Bandit",emoji:"👺",hp:90,maxHp:90,atk:11,xp:45,coins:32},
  {name:"Shadow Beast",emoji:"🐺",hp:120,maxHp:120,atk:14,xp:65,coins:50}
];

function $(id){return document.getElementById(id)}
function save(){localStorage.setItem("shadowShinobi",JSON.stringify(state))}
function load(){
  try{const s=JSON.parse(localStorage.getItem("shadowShinobi"));if(s)Object.assign(state,s)}catch(e){}
}
function renderStats(){
  $("level").textContent=state.level;
  $("xp").textContent=state.xp;
  $("nextxp").textContent=state.level*100;
  $("coins").textContent=state.coins;
}
function log(msg){
  const box=$("log"); if(!box)return;
  const d=document.createElement("div");d.textContent=msg;box.prepend(d);
}
function gainXP(n){
  state.xp+=n;
  while(state.xp>=state.level*100){
    state.xp-=state.level*100; state.level++;
    state.maxHp+=15; state.maxEnergy+=5; state.attack+=2;
    state.defense+=1; state.agility+=1; state.crit=Math.min(50,state.crit+1);
    state.hp=state.maxHp; state.energy=state.maxEnergy;
    log("✨ Level up! You are now level "+state.level+"!");
  }
}
function avatarEmoji(){
  const faces=state.gender==="Female"?["🥷🏻","👩🏻‍🎤","🧕🏻"]:["🥷🏻","🧑🏻‍🎤","👨🏻‍🦱"];
  return faces[state.hair%faces.length];
}
function outfitName(){return ["Shadow Garb","Forest Garb","Crimson Garb"][state.outfit%3]}
function home(){
  state.enemy=null;state.busy=false;
  $("app").innerHTML=`
  <div class="screen">
    <div class="village">
      <div class="moon"></div><div class="mountain one"></div><div class="mountain two"></div>
      <div class="village-title"><h2>HIDDEN SHADOW VILLAGE</h2><span>Welcome back, ${state.name}</span></div>
      <div class="location loc-academy" onclick="profile()">📜 <span>Academy<small>Train</small></span></div>
      <div class="location loc-shop" onclick="shop()">🏪 <span>Shop<small>Gear & items</small></span></div>
      <div class="location loc-dojo" onclick="profile()">🥋 <span>Dojo<small>Character</small></span></div>
      <div class="location loc-missions" onclick="missions()">⚔️ <span>Mission Board<small>Earn XP & coins</small></span></div>
      <div class="village-character">${avatarEmoji()}</div>
    </div>
    <div class="hudrow">
      <div class="meter">❤️ HP ${state.hp}/${state.maxHp}<i style="width:${state.hp/state.maxHp*100}%"></i></div>
      <div class="meter">🔵 Chakra ${state.energy}/${state.maxEnergy}<i style="width:${state.energy/state.maxEnergy*100}%;background:#5ba7e7"></i></div>
    </div>
    <div class="quick">
      <button class="btn primary" onclick="missions()">⚔️ Missions</button>
      <button class="btn" onclick="profile()">🥷 Character</button>
      <button class="btn" onclick="shop()">🏪 Shop</button>
      <button class="btn" onclick="jutsuMenu()">🌀 Jutsu</button>
    </div>
    <div class="menu">
      <button class="btn primary" onclick="home()">Village</button>
      <button class="btn" onclick="missions()">Missions</button>
      <button class="btn" onclick="profile()">Character</button>
      <button class="btn" onclick="shop()">Shop</button>
      <button class="btn" onclick="jutsuMenu()">Jutsu</button>
    </div>
  </div>`;
  renderStats();
}
function shop(){
  $("app").innerHTML=`<div class="screen"><div class="card"><h2>🏪 Ninja Shop</h2><p>Equipment and items are coming next.</p><button class="btn primary" onclick="home()">Return to Village</button></div><div class="menu"><button class="btn" onclick="home()">Village</button><button class="btn" onclick="missions()">Missions</button><button class="btn" onclick="profile()">Character</button><button class="btn primary" onclick="shop()">Shop</button><button class="btn" onclick="jutsuMenu()">Jutsu</button></div></div>`;
  renderStats();
}
function jutsuMenu(){
  $("app").innerHTML=`<div class="screen"><div class="card"><h2>🌀 Jutsu</h2><div class="hero"><div class="card"><h3>🔥 Fire Style: Fireball</h3><p>Chakra: 15 · Power: 20+</p><button class="btn primary" onclick="missions()">Test in Battle</button></div><div class="card"><h3>⚡ Lightning Style</h3><p>Locked · Unlock at a higher level.</p></div></div></div><div class="menu"><button class="btn" onclick="home()">Village</button><button class="btn" onclick="missions()">Missions</button><button class="btn" onclick="profile()">Character</button><button class="btn" onclick="shop()">Shop</button><button class="btn primary" onclick="jutsuMenu()">Jutsu</button></div></div>`;
  renderStats();
}
function missions(){
  $("app").innerHTML=`
  <div class="screen">
    <div class="menu">
      <button class="btn" onclick="home()">Village</button>
      <button class="btn primary" onclick="missions()">Missions</button>
      <button class="btn" onclick="profile()">Profile</button>
    </div>
    <h2>Mission Board</h2>
    <div class="hero">
      <div class="card">
        <h3>🌲 Forest Patrol</h3><p>Difficulty: Easy</p>
        <p>Defeat a rogue shinobi.</p>
        <button class="btn primary" onclick="startBattle(0)">Accept Mission</button>
      </div>
      <div class="card">
        <h3>👺 Bandit Hunt</h3><p>Difficulty: Medium</p>
        <p>Clear the road of bandits.</p>
        <button class="btn primary" onclick="startBattle(1)">Accept Mission</button>
      </div>
      <div class="card">
        <h3>🐺 Shadow Hunt</h3><p>Difficulty: Hard</p>
        <p>A dangerous beast has appeared.</p>
        <button class="btn primary" onclick="startBattle(2)">Accept Mission</button>
      </div>
    </div>
  </div>`;
  renderStats();
}
function profile(){
  $("app").innerHTML=`
  <div class="screen">
    <div class="menu">
      <button class="btn" onclick="home()">Village</button>
      <button class="btn" onclick="missions()">Missions</button>
      <button class="btn primary" onclick="profile()">Profile</button>
    </div>
    <div class="hero">
      <div class="card">
        <h2>Shinobi Profile</h2>
        <label>Name</label>
        <input class="input" id="nameInput" maxlength="20" value="${state.name}">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button class="btn ${state.gender==="Male"?"primary":""}" onclick="setGender('Male')">♂ Male</button>
          <button class="btn ${state.gender==="Female"?"primary":""}" onclick="setGender('Female')">♀ Female</button>
        </div>
        <h3 style="margin-top:18px">Appearance</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button class="btn" onclick="cycleHair()">Change Hair</button>
          <button class="btn" onclick="cycleOutfit()">Change Outfit</button>
        </div>
        <button class="btn primary" style="width:100%;margin-top:10px" onclick="changeName()">Save Character</button>
      </div>
      <div class="card">
        <div class="avatar" style="font-size:100px">${avatarEmoji()}</div>
        <p style="text-align:center"><b>${outfitName()}</b></p>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <h3>⚔️ Shinobi Stats</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="pill">❤️ Health <b>${state.maxHp}</b></div>
        <div class="pill">🔵 Chakra <b>${state.maxEnergy}</b></div>
        <div class="pill">⚔️ Attack <b>${state.attack}</b></div>
        <div class="pill">🛡️ Defense <b>${state.defense}</b></div>
        <div class="pill">💨 Agility <b>${state.agility}</b></div>
        <div class="pill">🎯 Critical <b>${state.crit}%</b></div>
      </div>
      <p class="sub" style="margin-top:14px">Level ${state.level} · ${state.xp}/${state.level*100} XP to next level</p>
      <button class="btn danger" onclick="resetGame()">Reset Progress</button>
    </div>
  </div>`;
  renderStats();
}
function changeName(){
  const n=$("nameInput").value.trim();
  if(n)state.name=n;
  save();profile();
}
function setGender(g){state.gender=g;save();profile()}
function cycleHair(){state.hair=(state.hair+1)%3;save();profile()}
function cycleOutfit(){state.outfit=(state.outfit+1)%3;save();profile()}
function resetGame(){
  if(confirm("Reset all progress?")){localStorage.removeItem("shadowShinobi");location.reload()}
}
function startBattle(index){
  const e=enemies[index];
  state.enemy={...e};
  state.busy=false;
  battle();
}
function battle(){
  const e=state.enemy;
  $("app").innerHTML=`
  <div class="screen">
    <div class="menu"><button class="btn" onclick="missions()">← Abandon Mission</button></div>
    <div class="hero">
      <div class="card">
        <h2>${state.name}</h2>
        <div>HP: ${state.hp}/${state.maxHp}</div>
        <div class="hp"><i style="width:${state.hp/state.maxHp*100}%"></i></div>
        <div>Energy: ${state.energy}/${state.maxEnergy}</div>
        <div class="hp"><i style="background:#5ba7e7;width:${state.energy/state.maxEnergy*100}%"></i></div>
        <div class="actions">
          <button class="btn primary" onclick="attack()">⚔️ Strike</button>
          <button class="btn" onclick="jutsu()">🌀 Fire Jutsu (15)</button>
          <button class="btn" onclick="heal()">💚 Recover (10)</button>
          <button class="btn" onclick="defend()">🛡️ Defend</button>
        </div>
      </div>
      <div class="card enemy">
        <h2>${e.emoji} ${e.name}</h2>
        <div class="avatar" style="height:190px;font-size:80px">${e.emoji}</div>
        <div>HP: ${e.hp}/${e.maxHp}</div>
        <div class="hp"><i style="width:${Math.max(0,e.hp/e.maxHp*100)}%"></i></div>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <h3>Battle Log</h3>
      <div class="log" id="log"></div>
    </div>
  </div>`;
  renderStats();
  log("⚔️ Battle started against "+e.name+"!");
}
function endBattle(){
  const e=state.enemy;
  gainXP(e.xp);state.coins+=e.coins;state.energy=Math.min(state.maxEnergy,state.energy+10);
  save();
  $("app").innerHTML=`
  <div class="screen"><div class="card" style="text-align:center">
    <div style="font-size:70px">🏆</div>
    <h2>Mission Complete!</h2>
    <p class="reward">+ ${e.xp} XP &nbsp; + ${e.coins} coins</p>
    <button class="btn primary" onclick="missions()">Continue</button>
  </div></div>`;
  renderStats();
}
function enemyTurn(){
  if(!state.enemy||state.enemy.hp<=0)return;
  const reduced=Math.max(0,state.enemy.atk-state.defense);
  const dmg=state.busy?Math.max(1,Math.floor(reduced/2)):Math.max(1,reduced);
  state.hp=Math.max(0,state.hp-dmg);
  log("💥 "+state.enemy.name+" dealt "+dmg+" damage.");
  state.busy=false;
  if(state.hp<=0){
    log("☠️ You were defeated...");
    setTimeout(()=>{state.hp=state.maxHp;state.energy=state.maxEnergy;save();missions()},700);
  }else{save();battle()}
}
function playerAction(fn){
  if(state.busy||!state.enemy)return;
  state.busy=true;fn();
  if(state.enemy.hp<=0){save();setTimeout(endBattle,350);return}
  setTimeout(enemyTurn,500);
}
function attack(){
  playerAction(()=>{
    const critical=Math.random()*100<state.crit;
    const dmg=(state.attack+Math.floor(Math.random()*7)+state.level)*(critical?2:1);
    log(critical?"🎯 CRITICAL HIT!":"");
    state.enemy.hp=Math.max(0,state.enemy.hp-dmg);
    log("⚔️ You struck for "+dmg+" damage.");
  });
}
function jutsu(){
  if(state.energy<15||state.busy)return;
  playerAction(()=>{
    state.energy-=15;
    const critical=Math.random()*100<state.crit;
    const dmg=(20+Math.floor(Math.random()*11)+state.level*2)*(critical?2:1);
    log(critical?"🎯 CRITICAL JUTSU!":"");
    state.enemy.hp=Math.max(0,state.enemy.hp-dmg);
    log("🌀 Fire Jutsu dealt "+dmg+" damage!");
  });
}
function heal(){
  if(state.busy||state.hp>=state.maxHp)return;
  playerAction(()=>{
    const amount=15+state.level*2;
    state.hp=Math.min(state.maxHp,state.hp+amount);
    log("💚 You recovered "+amount+" HP.");
  });
}
function defend(){
  playerAction(()=>{log("🛡️ You brace for the next attack.");});
}

<script>
(function(){
let animFrame=0, battleScene=null;
function stopAnimation(){if(animFrame)cancelAnimationFrame(animFrame);animFrame=0;battleScene=null}
function battleUI(){
 const e=state.enemy;
 $("app").innerHTML=`
 <div class="screen">
  <div class="menu"><button class="btn" onclick="missions()">← Leave Battle</button></div>
  <div class="arena"><canvas id="battleCanvas" width="1000" height="520"></canvas></div>
  <div class="battleHud">
   <div class="card"><b>🥷 ${state.name}</b><div>HP: ${state.hp}/${state.maxHp}</div><div class="hp"><i id="playerBar" style="width:${state.hp/state.maxHp*100}%"></i></div><div>Chakra: ${state.energy}/${state.maxEnergy}</div><div class="hp"><i id="energyBar" style="width:${state.energy/state.maxEnergy*100}%;background:#5ba7e7"></i></div></div>
   <div class="card"><b>${e.emoji} ${e.name}</b><div>HP: <span id="enemyHp">${e.hp}</span>/${e.maxHp}</div><div class="hp"><i id="enemyBar" style="width:100%;background:#e75b68"></i></div></div>
  </div>
  <div class="combatActions">
   <button class="btn primary" onclick="animatedAttack()">⚔️ Strike</button>
   <button class="btn" onclick="animatedJutsu()">🔥 Fire Jutsu</button>
   <button class="btn" onclick="animatedHeal()">💚 Recover</button>
   <button class="btn" onclick="animatedDefend()">🛡️ Defend</button>
  </div>
  <div class="card" style="margin-top:10px"><b>Combat Log</b><div class="log" id="log"></div></div>
 </div>`;
 renderStats(); log("⚔️ Battle arena loaded — choose your move.");
 startAnimation();
}
function startAnimation(){
 stopAnimation();
 const canvas=$("battleCanvas"); if(!canvas)return;
 const ctx=canvas.getContext("2d");
 battleScene={ctx,t:0,action:null,shake:0,particles:[]};
 function frame(){
  if(!battleScene)return;
  battleScene.t+=0.016;
  drawArena(ctx,canvas.width,canvas.height);
  animFrame=requestAnimationFrame(frame);
 }
 frame();
}
function particle(x,y,color,count=24){
 for(let i=0;i<count;i++)battleScene.particles.push({x,y,vx:(Math.random()-.5)*9,vy:(Math.random()-.65)*9,life:1,color});
}
function drawArena(ctx,w,h){
 const s=battleScene, e=state.enemy;
 let sx=s.shake>0?(Math.random()-.5)*s.shake:0; s.shake=Math.max(0,s.shake-.6);
 ctx.save();ctx.translate(sx,0);
 const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,"#172b49");g.addColorStop(.62,"#0a1422");g.addColorStop(1,"#07100d");ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 ctx.fillStyle="#10251a";ctx.fillRect(0,h*.72,w,h*.28);
 for(let i=0;i<12;i++){let x=i*100+((s.t*8)%100);ctx.fillStyle="#0d2117";ctx.beginPath();ctx.moveTo(x,h*.72);ctx.lineTo(x+35,h*.40);ctx.lineTo(x+70,h*.72);ctx.fill();}
 const bob=Math.sin(s.t*4)*3;
 drawFighter(ctx,260,h*.70+bob,"#8fb6e8",false,s.action==="player");
 drawFighter(ctx,740,h*.70-bob,e.color,true,s.action==="enemy");
 if(s.action==="player"){ctx.strokeStyle="#dcecff";ctx.lineWidth=9;ctx.globalAlpha=.7;ctx.beginPath();ctx.moveTo(300,h*.48);ctx.lineTo(690,h*.55);ctx.stroke();ctx.globalAlpha=1}
 if(s.action==="fire"){ctx.fillStyle="#ff8a32";ctx.beginPath();ctx.arc(470+(s.t%1)*220,h*.51,18+Math.sin(s.t*20)*5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ffd166";ctx.beginPath();ctx.arc(470+(s.t%1)*220,h*.51,9,0,Math.PI*2);ctx.fill()}
 if(s.action==="hit"){ctx.strokeStyle="#fff";ctx.lineWidth=7;ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(740,h*.52,35+Math.sin(s.t*35)*20,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
 for(const p of s.particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.life-=.025;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,6,6)}
 s.particles=s.particles.filter(p=>p.life>0);ctx.restore();
}
function drawFighter(ctx,x,y,color,enemy,attacking){
 ctx.save();ctx.translate(x,y);
 const lean=attacking?(enemy?-0.25:0.25):0;ctx.rotate(lean);
 ctx.fillStyle="#090d15";ctx.fillRect(-27,-110,54,85);
 ctx.fillStyle=color;ctx.fillRect(-38,-25,76,68);
 ctx.fillStyle="#d5a47c";ctx.beginPath();ctx.arc(0,-130,30,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#11151d";ctx.fillRect(-32,-142,64,20);
 ctx.fillStyle="#fff";ctx.fillRect(enemy?-16:7,-136,7,4);ctx.fillRect(enemy?8:-14,-136,7,4);
 ctx.strokeStyle=color;ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(-32,0);ctx.lineTo(enemy?-82:82,-30);ctx.stroke();
 ctx.strokeStyle="#161b25";ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-18,42);ctx.lineTo(-30,85);ctx.moveTo(18,42);ctx.lineTo(30,85);ctx.stroke();
 ctx.restore();
}
function bars(){if(!$("playerBar"))return;$("playerBar").style.width=Math.max(0,state.hp/state.maxHp*100)+"%";$("energyBar").style.width=Math.max(0,state.energy/state.maxEnergy*100)+"%";$("enemyHp").textContent=state.enemy.hp;$("enemyBar").style.width=Math.max(0,state.enemy.hp/state.enemy.maxHp*100)+"%"}
function actionLock(){return state.busy||!state.enemy}
function finishPlayerMove(callback,type){
 state.busy=true;battleScene.action=type;particle(type==="fire"?470:740,260,type==="fire"?"#ff9f43":"#eaf4ff",type==="fire"?34:20);
 callback();bars();
 if(state.enemy.hp<=0){battleScene.shake=16;log("💥 Finishing blow!");setTimeout(endAnimatedBattle,750);return}
 setTimeout(function(){enemyAnimatedTurn()},700);
}
window.animatedAttack=function(){
 if(actionLock())return;
 finishPlayerMove(function(){const crit=Math.random()*100<state.crit;const dmg=(state.attack+Math.floor(Math.random()*7)+state.level)*(crit?2:1);state.enemy.hp=Math.max(0,state.enemy.hp-dmg);battleScene.shake=8;log((crit?"🎯 CRITICAL HIT! ":"")+"⚔️ You slash for "+dmg+" damage.");},"player");
}
window.animatedJutsu=function(){
 if(actionLock()||state.energy<15){if(state.energy<15)log("🔵 Not enough chakra.");return}
 finishPlayerMove(function(){state.energy-=15;const crit=Math.random()*100<state.crit;const dmg=(20+Math.floor(Math.random()*11)+state.level*2)*(crit?2:1);state.enemy.hp=Math.max(0,state.enemy.hp-dmg);battleScene.action="fire";battleScene.shake=10;log((crit?"🔥 CRITICAL JUTSU! ":"")+"🔥 Fireball hits for "+dmg+" damage.");},"fire");
}
window.animatedHeal=function(){
 if(actionLock()||state.hp>=state.maxHp)return;
 finishPlayerMove(function(){const n=15+state.level*2;state.hp=Math.min(state.maxHp,state.hp+n);particle(260,270,"#63e6a0",25);log("💚 Healing chakra restores "+n+" HP.");},"heal");
}
window.animatedDefend=function(){
 if(actionLock())return;
 finishPlayerMove(function(){state.defending=true;log("🛡️ You raise your guard.");},"guard");
}
function enemyAnimatedTurn(){
 if(!state.enemy||state.enemy.hp<=0)return;
 battleScene.action="enemy";particle(270,270,"#ff6b6b",18);battleScene.shake=7;
 const reduced=Math.max(1,state.enemy.atk-state.defense);const dmg=state.defending?Math.max(1,Math.floor(reduced/2)):reduced;state.defending=false;
 setTimeout(function(){state.hp=Math.max(0,state.hp-dmg);bars();log("💥 "+state.enemy.name+" attacks for "+dmg+" damage.");state.busy=false;battleScene.action=null;
  if(state.hp<=0){log("☠️ You were defeated.");setTimeout(function(){state.hp=state.maxHp;state.energy=state.maxEnergy;save();stopAnimation();missions()},900)}else save();
 },350);
}
function endAnimatedBattle(){
 const e=state.enemy;gainXP(e.xp);state.coins+=e.coins;state.energy=Math.min(state.maxEnergy,state.energy+10);save();stopAnimation();
 $("app").innerHTML='<div class="screen"><div class="card" style="text-align:center;padding:38px"><div style="font-size:80px">🏆</div><h2>MISSION COMPLETE!</h2><p class="reward">+'+e.xp+' XP · +'+e.coins+' coins</p><p>The enemy exploded into particles after your finishing move.</p><button class="btn primary" onclick="missions()">Continue</button></div></div>';renderStats();
}
window.startBattle=function(index){stopAnimation();state.enemy={...enemies[index]};state.busy=false;state.defending=false;battleUI()}
window.missions=missions;
window.home=home;
window.profile=profile;
stopAnimation();
})();
</script>
